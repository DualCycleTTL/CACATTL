<div id="step3-card-marker" class="step3-header-container"
    style="display:flex;align-items:center;justify-content:space-between;width:100%;margin:0 0 16px 0;padding:0 0 14px 0;border-bottom:1px solid rgba(255,255,255,0.08);flex-wrap:wrap;gap:12px;scroll-margin-top:24px;">
    <div class="step3-header-left" style="display:flex;align-items:center;gap:12px;">
        <span class="step3-badge-num"
            style="background:linear-gradient(135deg, #0284c7, #0369a1);color:#ffffff;width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:0.9rem;font-weight:800;box-shadow:0 2px 8px rgba(2,132,199,0.4);flex-shrink:0;">3</span>
        <div>
            <div class="step3-title" style="font-size:1.05rem;font-weight:800;color:#ffffff;letter-spacing:-0.2px;line-height:1.3;">Executive KPI &amp;
                Evaluasi Hasil Analisis</div>
            <div class="step3-subtitle" style="font-size:0.83rem;color:#94a3b8;margin-top:2px;line-height:1.4;">Hasil rekonstruksi siklus kontainer, rasio Dual
                Cycle, serta utilisasi Twin Lift</div>
        </div>
    </div>
    <div class="step3-header-right" style="display:flex;flex-direction:column;align-items:flex-end;text-align:right;">
        <div class="step3-period-title" style="font-size:1.05rem;font-weight:800;color:#ffffff;letter-spacing:-0.2px;display:inline-flex;align-items:center;gap:7px;line-height:1.3;">
            <span class="step3-period-icon" style="font-size:1.15rem;line-height:1;">🗓️</span>
            <span class="step3-period-val" style="color:#ffffff;">{{ period_label }}</span>
        </div>
        <div class="step3-period-subtitle" style="font-size:0.83rem;color:#94a3b8;margin-top:2px;line-height:1.4;">Periode Data Dianalisis</div>

</div>
